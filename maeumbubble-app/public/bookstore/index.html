<style>
/* Layout: one calm column — bubble header, two soft tabs, one input card, latest result only */
:root{
  --bg:#fdf8f5; --surface:#ffffff; --ink:#3a302d; --muted:#8a7d78; --line:#f0e4de;
  --accent:#d9718f; --accent-ink:#ffffff; --accent-soft:#fbe6ec; --ai:#8c78c9; --ai-soft:#efeafa;

  --display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1a1a; --surface:#292323; --ink:#f2e9e6; --muted:#b4a6a1; --line:#3b3231;
  --accent:#ee9ab2; --accent-ink:#2a1a1f; --accent-soft:#45282f; --ai:#b9a8ec; --ai-soft:#2f2a40;
  --warn-soft:#3a2f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1a1a; --surface:#292323; --ink:#f2e9e6; --muted:#b4a6a1; --line:#3b3231;
  --accent:#ee9ab2; --accent-ink:#2a1a1f; --accent-soft:#45282f; --ai:#b9a8ec; --ai-soft:#2f2a40;
  --warn-soft:#3a2f22; color-scheme:dark}
/* 버전2: 푸른 윤슬 강물 배경 (canvas#river에 직접 그려요) */
:root{--river:#cfe7f6;--on-river:#33414d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--river:#0e2438;--on-river:#dbe7f2}}
:root[data-theme="dark"]{--river:#0e2438;--on-river:#dbe7f2}
#river{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block;pointer-events:none}
main > section > .chips .lbl, main > section > .result > .mood, .pick-l, main .privacy{color:var(--on-river)}
*{box-sizing:border-box}
body{background:var(--river);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:36px 56px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px;zoom:var(--zoom,1)}
/* 버전2: 오른쪽 위 도구줄(언어 + BGM) */
.topbar{align-self:stretch;display:flex;gap:8px;align-items:center;margin-bottom:-8px}
.topbar-gap{flex:1}
.books .pending{margin-top:4px;font-size:.72rem;color:var(--muted);opacity:.85}
.bgm.home{margin-left:0;text-decoration:none}
/* 버전2: 왼쪽 위 밝은/다크 모드 버튼 (밝을 땐 달, 어두울 땐 해 아이콘) */
.theme{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);color:var(--hero-sub,#0a2e70);border-radius:50%;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08);padding:0}
.theme:hover{border-color:var(--accent)}
.theme .i-sun{display:none;color:#f2c14e}
.theme[data-mode="dark"] .i-sun{display:block}
.theme[data-mode="dark"] .i-moon{display:none}
.lang{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.bgm{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.bgm:hover{border-color:var(--accent)}
.bgm[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.8rem;padding:3px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:500}
header{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.bubble{font-size:2.2rem;line-height:1}
h1{font-family:var(--display);font-size:1.7rem;font-weight:400;margin:0}
header p{margin:0;color:var(--muted)}
/* 버전2: 로고 썸네일 + 흰 반투명 제목 카드 */
:root{--hero-bg:rgba(255,255,255,.8);--hero-h:#061b42;--hero-sub:#0a2e70dd;--hero-desc:#444}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero-bg:rgba(41,35,35,.85);--hero-h:#e3ebff;--hero-sub:#b3c6f0;--hero-desc:#c9bdb8}}
:root[data-theme="dark"]{--hero-bg:rgba(41,35,35,.85);--hero-h:#e3ebff;--hero-sub:#b3c6f0;--hero-desc:#c9bdb8}
/* 버전2: 상자 없이 물 위에 반투명하게 떠 있는 큰 구름 */
.thumb{display:block;width:340px;max-width:82%;height:auto;margin:-6px auto -18px;opacity:.9;filter:drop-shadow(0 22px 18px rgba(40,90,140,.22));animation:cloud-float 8s ease-in-out infinite;position:relative;z-index:1}
@keyframes cloud-float{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-9px)}}
@media (prefers-reduced-motion:reduce){.thumb{animation:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .thumb{opacity:.82;filter:drop-shadow(0 22px 18px rgba(0,0,0,.35))}}
:root[data-theme="dark"] .thumb{opacity:.82;filter:drop-shadow(0 22px 18px rgba(0,0,0,.35))}
.header-area{align-self:stretch;text-align:left;background:var(--hero-bg);border-radius:12px;padding:1.8rem 2rem;box-shadow:0 4px 8px rgba(0,0,0,.05)}

.header-area p.subtitle{font-weight:500;font-size:1.2rem;letter-spacing:.08em;margin:0 0 .8rem;color:var(--hero-sub)}
.header-area p.desc{font-weight:400;font-size:1rem;letter-spacing:.05em;margin:0;color:var(--hero-desc)}
@media (max-width:520px){.header-area{padding:1.4rem 1.3rem}.header-area h1{font-size:2rem}}
/* 버전2: 오른쪽 아래 언어 표시 */
.lang-label{position:fixed;bottom:16px;right:16px;background:rgba(255,255,255,.7);color:#555;font-size:12px;padding:4px 8px;border-radius:6px;font-weight:500;user-select:none;box-shadow:0 0 8px rgba(0,0,0,.05);z-index:10}
/* 버전2: 왼쪽 아래 글자 크기(확대 비율) 버튼 - 눈이 잘 안 보이는 분들을 위해. 손가락으로 누르기 쉽게 44px 이상 */
.zoom-ctl{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.14)}
.zoom-ctl button{min-width:44px;height:44px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;line-height:1;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:1px}
.zoom-ctl button:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
.zoom-ctl button:disabled{opacity:.35;cursor:default}
#zoom-out{font-size:.9rem}
#zoom-in{font-size:1.25rem}
#zoom-reset{font-size:.8rem;font-weight:600;color:var(--muted);min-width:54px}
body{padding-bottom:88px;word-break:keep-all;overflow-wrap:anywhere}
/* 크게 볼 때 위쪽 버튼이 찌그러지지 않게: 글자는 한 줄, 공간이 모자라면 다음 줄로 */
.topbar{flex-wrap:wrap;row-gap:8px}
.lang button,.bgm{white-space:nowrap}
.bgm{margin-left:auto}
/* 크게 볼 때 감정 버튼이 좁아지면 2줄 배치(그림 옆에 글자)로 */
/* (자바스크립트가 실제 폭을 재서 .narrow를 붙여요) */
.pick.narrow .pick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.pick.narrow .feel{flex-direction:row;justify-content:center;gap:6px;padding:10px 6px;font-size:.95rem}

[role=tablist]{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px}
[role=tab]{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:8px 10px;border-radius:999px;cursor:pointer}
[role=tab][aria-selected=true]#t-rule{background:var(--accent-soft);color:var(--accent)}
[role=tab][aria-selected=true]#t-ai{background:var(--ai-soft);color:var(--ai)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[role=tabpanel]{display:flex;flex-direction:column;gap:14px}
[role=tabpanel][hidden]{display:none}

form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
form label{font-family:var(--display);font-size:1.05rem}
textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
form button{border:0;border-radius:999px;padding:9px 20px;font:inherit;font-weight:500;cursor:pointer;color:var(--accent-ink);background:var(--accent)}
#p-ai form button{background:var(--ai)}
form button:disabled{opacity:.5;cursor:default}
.hint{margin:0;font-size:.82rem;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:.82rem;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.86rem;padding:4px 12px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.pick{display:flex;flex-direction:column;gap:8px}
.pick-l{margin:0;font-weight:500}
.pick-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:520px){.pick-grid{gap:6px}.feel{font-size:.76rem;padding:8px 2px;word-break:keep-all;text-align:center;line-height:1.3}}
.feel{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.86rem;padding:10px 4px;border-radius:14px;cursor:pointer}
.feel .fe{font-size:1.4rem;line-height:1.2}
.feel:hover{border-color:var(--accent)}
.feel[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}

.result{display:flex;flex-direction:column;gap:12px}
.result:empty{display:none}
.mood{font-family:var(--display);font-size:1.1rem;margin:0}
.mood b{font-weight:400;color:var(--accent)}
#p-ai .mood b{color:var(--ai)}
.read{margin:0;background:var(--ai-soft);border-radius:12px;padding:10px 14px}
.soft{margin:0;background:var(--warn-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.soft p{margin:0}
.thinking{margin:0;color:var(--ai);font-family:var(--display);font-size:1.05rem}
.books{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.books li{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.books .em{font-size:1.6rem;line-height:1.3;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);flex-shrink:0}
#p-ai .books .em{background:var(--ai-soft)}
.books .cover{width:64px;height:auto;flex-shrink:0;border-radius:4px;background:var(--line);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.books .bk{min-width:0}
.books .t{font-weight:700}
.books .a{color:var(--muted);font-size:.85rem}
.books .w{margin-top:4px;font-size:.93rem}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.fb h2{font-family:var(--display);font-size:1.05rem;font-weight:400;margin:0}
.fb .stars{display:flex;gap:2px;border:0;margin:0;padding:0}
.fb .stars legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fb .stars label{cursor:pointer;font-size:1.5rem;line-height:1;color:var(--line);padding:2px}
.fb .stars input{position:absolute;opacity:0;width:1px;height:1px}
.fb .stars label.on{color:var(--accent)}
.fb .stars input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.fb textarea{min-height:60px}
.fb button{border:0;border-radius:999px;padding:8px 18px;font:inherit;font-weight:500;cursor:pointer;color:var(--accent-ink);background:var(--accent)}
.fb button:disabled{opacity:.5;cursor:default}
.fb .msg{font-size:.86rem;color:var(--muted);margin:0}
.privacy{margin:0;text-align:center;font-size:.78rem;color:var(--muted)}
/* 버전2: '쪽지 도착' 알림 + 인용 카드 쪽지 */
:root{--paper:#fffaf0;--paper-line:rgba(10,46,112,.07);--paper-ink:#2f3a46}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#2e2928;--paper-line:rgba(255,255,255,.05);--paper-ink:#efe6e2}}
:root[data-theme="dark"]{--paper:#2e2928;--paper-line:rgba(255,255,255,.05);--paper-ink:#efe6e2}
.note-toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--accent);border-radius:999px;padding:4px 4px 4px 6px;box-shadow:0 8px 24px rgba(20,50,90,.22);zoom:var(--zoom,1);max-width:calc((100vw - 24px) / var(--zoom,1))}
.note-toast[hidden]{display:none}
.nt-open{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer;padding:6px 10px 6px 6px;border-radius:999px;text-align:left}
.nt-ico{font-size:1.6rem;line-height:1}
.nt-txt{display:flex;flex-direction:column;line-height:1.25}
.nt-txt b{font-family:var(--pen);font-size:1.3rem;color:var(--accent)}
.nt-txt small{font-size:.78rem;color:var(--muted)}
.nt-x{width:36px;height:36px;border:0;background:transparent;color:var(--muted);font-size:1.3rem;border-radius:50%;cursor:pointer}
.nt-x:hover,.nt-open:hover{background:var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){
  .note-toast:not([hidden]){animation:nt-drop .5s cubic-bezier(.2,1.3,.4,1) both}
  .note-toast:not([hidden]) .nt-ico{animation:nt-wiggle 1.4s ease-in-out .5s 2}
  @keyframes nt-drop{from{opacity:0;transform:translate(-50%,-24px)}}
  @keyframes nt-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
}
dialog.note{width:min(560px,calc(100vw - 24px));max-height:88vh;border:0;border-radius:22px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,30,60,.35);overflow:hidden}
/* 창 크기는 화면에 맞추고, 안의 글자·카드만 확대해요 */
.note-hd,.note-body{zoom:var(--zoom,1)}
dialog.note[open]{display:flex;flex-direction:column}
dialog.note::backdrop{background:rgba(10,30,55,.38);backdrop-filter:blur(2px)}
.note-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px 22px}
.note-hd h2{margin:0;font-family:var(--pen);font-weight:700;font-size:1.6rem;color:var(--hero-h)}
.note-close{width:40px;height:40px;border:0;background:transparent;color:var(--muted);font-size:1.5rem;border-radius:50%;cursor:pointer}
.note-close:hover{background:var(--accent-soft)}
.note-body{overflow-y:auto;padding:4px 22px 20px}
.note-lead{margin:0 0 12px;font-family:var(--pen);font-size:1.25rem;line-height:1.4}
.note-lead b{color:var(--accent);font-weight:700}
.qcards{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:thin}
.qcard{scroll-snap-align:center;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:250px;padding:24px 20px 18px;border-radius:16px;border:1px solid var(--line);color:var(--paper-ink);
  background:repeating-linear-gradient(180deg,transparent 0 31px,var(--paper-line) 31px 32px),var(--paper);box-shadow:0 4px 14px rgba(20,50,90,.10)}
.qcard .q{margin:0;font-family:var(--pen);font-size:1.4rem;line-height:1.6;white-space:pre-line;letter-spacing:-.02em}
.qcard .who{margin:0;font-size:.85rem;color:var(--muted)}
.qcard .who b{color:var(--ink);font-weight:600}
.qbtn{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font:inherit;font-size:.86rem;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.qbtn:hover{background:var(--accent);color:var(--accent-ink)}
.qdots{display:flex;justify-content:center;gap:6px;margin:2px 0 8px}
.qdots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.qdots span.on{background:var(--accent)}
.note-hint{margin:0;text-align:center;font-size:.78rem;color:var(--muted)}
.au-back{border:0;background:transparent;color:var(--accent);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}

<main>

  </nav>

  <section role="tabpanel" id="p-rule" aria-labelledby="t-rule">

      <textarea id="q-rule" maxlength="300" placeholder="예: 발표 앞두고 불안해" data-i18n-ph="phRule"></textarea>
      <div class="row"><span class="count" id="c-rule">0/300</span><button type="submit" data-i18n="submit">책 추천받기</button></div>
      <p class="hint" data-i18n="hintRule" hidden></p>
    </form>
    <div class="chips" id="chips-rule"></div>
    <div class="result" id="out-rule" aria-live="polite"></div>
  </section>

  <section role="tabpanel" id="p-ai" aria-labelledby="t-ai" hidden>
    <form id="f-ai">
      <label for="q-ai" data-i18n="ask">오늘 마음을 한 문장으로 적어 주세요</label>
      <textarea id="q-ai" maxlength="300" placeholder="예: 불안한 건 아닌데 마음이 허해" data-i18n-ph="phAi"></textarea>
      <div class="row"><span class="count" id="c-ai">0/300</span><button type="submit" id="b-ai" data-i18n="submit">책 추천받기</button></div>

    </form>
    <div class="chips" id="chips-ai"></div>
    <div class="result" id="out-ai" aria-live="polite"></div>
  </section>

  <form class="fb" id="fb" hidden>
    <h2 data-i18n="fbTitle">추천이 마음에 닿았나요?</h2>
    <fieldset class="stars" id="fb-stars">
      <legend data-i18n="fbRating">별점</legend>
    </fieldset>
    <textarea id="fb-msg" maxlength="1000" data-i18n-ph="fbPh" placeholder="하고 싶은 말을 남겨 주세요 (선택)"></textarea>
    <div class="row"><p class="msg" id="fb-out" aria-live="polite"></p><button type="submit" data-i18n="fbSend">보내기</button></div>
  </form>
  <p class="privacy" id="privacy" data-i18n="privacy" hidden>AI에게 물어본 문장은 추천을 만들기 위해 AI(Anthropic Claude)로 보내지만 저장하지 않아요. 별점과 한마디만 서비스를 다듬기 위해 이름 없이 30일 보관하니, 이름·연락처 같은 개인정보는 적지 말아 주세요.</p>
</main>

  bgm.addEventListener("play", bgmLabel);
  bgm.addEventListener("pause", bgmLabel);
  bgmBtn.addEventListener("click", () => {
    bgmUnkick();
    if (bgm.paused) {
      bgmWanted = true;
      bgmSave("on");
      bgmPlay();
    } else {
      bgmWanted = false;
      bgmSave("off");
      bgm.pause();
    }
  });
  var KICK = ["pointerdown", "keydown"];
  function bgmKick(e) {
    if (e.target instanceof Element && e.target.closest("#bgm-toggle")) return;
    bgmUnkick();
    if (bgmWanted && bgm.paused) bgmPlay();
  }
  function bgmUnkick() {
    KICK.forEach((n) => removeEventListener(n, bgmKick, true));
  }
  if (bgmWanted) {
    KICK.forEach((n) => addEventListener(n, bgmKick, true));
    bgmPlay().then(() => {
      if (!bgm.paused) bgmUnkick();
    });
  }

  applyLang();
  fillAndRun("rule", EXAMPLES_KO[0]);
  cloud.visit(lang);

  // 관리자 페이지에서 고친 책 목록을 불러와요 (실패하면 기본 목록 그대로)
  if (cloud.enabled) {
    cloud.books().then((rows) => {
      if (!rows) return;
      const fresh = rows.map((r) => ({
        id: r.id, title: r.title, author: r.author, category: r.category, mood: r.mood, note: r.note,
        keywords: Array.isArray(r.keywords) ? r.keywords : [], emoji: r.emoji || "📘", cover_url: r.cover_url || ""
      }));
      BOOKS.length = 0;
      BOOKS.push(...fresh);
      if (lastRule) ruleRespond(lastRule);
    });
  }
})();

</script>
